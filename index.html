<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product list</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./main.js"></script>
</head>
<body>
    <div class="container">
        <div class="list-container">
            <h1 class="heading">desserts</h1>
            <ul class="item-list">
                <li class="item">
                    <div class="item-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcf2A7GsnCKm3SgMnMGHO4cddVaCoYsj3OIQ&s" alt="item-img">
                        <button class="add"><i class='bx  bx-cart'></i>  add to cart</button>
                    </div>
                    <div class="details">
                        <p class="item-title">waffel with berries</p>
                        <p class="price">$6.50</p>
                    </div>
                </li>
            </ul>
        </div>
        <div class="cart-container"></div>
    </div>

    <i class='bx  bx-cart'></i>
</body>
</html>
