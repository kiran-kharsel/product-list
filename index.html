<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product list</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./main.js"></script>
</head>

<body>
    <div class="container">
        <div class="list-container">
            <h1 class="heading">desserts</h1>
            <ul class="item-list">
                <li class="item">
                    <div class="item-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcf2A7GsnCKm3SgMnMGHO4cddVaCoYsj3OIQ&s" alt="item-img">
                        <div class="btn-container">
                            <button onclick="addToCart()" class="add"><i class='bx  bx-cart'></i>  add to cart</button>
                            <div class="hidden">
                                <i role="button" class='bx  bx-minus-circle'></i> 
                                <span>2</span>
                                <i role="button" class='bx  bx-plus-circle'></i> 
                            </div>
                        </div>
                    </div>
                    <div class="details">
                        <p class="item-title">waffel with berries</p>
                        <p class="price">$6.50</p>
                    </div>
                </li>
            </ul>
        </div>


        <div class="cart-container">
            <div class="cart">
                <h2 class="cart-heading"> your cart <span>(0)</span></h2>
                <ul class="cart-list">
                    <!-- <li class="cart-item">
                        <div class="item-detail">
                            <p class="title">tiramisu</p>
                            <div>
                                <span class="quantity">1x</span>
                                <span class="price">5.50</span>
                                <span class="total">5.50</span>
                            </div>
                        </div>
                        <button class="item-cancel">
                            <i class='bx  bx-x-circle'></i> 
                        </button>
                    </li> -->
                </ul>
                <div class="total-price">
                    <p>order total</p>
                    <span>0.00</span>
                </div>
                <button class="confirm-order">confirm order</button>
            </div>

        </div>
    </div>
</body>

</html>
